<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fbfaf6">
    <meta name="description" content="Choose a new FaithConnect password.">
    <title>Choose a new password | FaithConnect</title>
    <link rel="stylesheet" href="/src/css/styles.css">
    <link rel="stylesheet" href="/src/css/auth.css">
    <script src="/src/js/auth.js" defer></script>
</head>
<body class="auth-page">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header"><nav class="navbar container" aria-label="Main navigation">
        <a class="brand" href="/" aria-label="FaithConnect home"><span class="brand-symbol" aria-hidden="true">✦</span><span>Faith<span class="brand-accent">Connect</span></span></a>
    </nav></header>
    <main class="auth-main container" id="main-content" tabindex="-1">
        <section class="auth-card auth-card-compact" aria-labelledby="page-title">
            <span class="eyebrow">ACCOUNT RECOVERY</span>
            <h1 id="page-title">Choose a new password</h1>
            <p class="auth-intro">Use at least 12 characters.</p>
            <form data-auth-form action="/api/auth/new-password" method="post" novalidate>
                <div class="form-field">
                    <label for="password">New password</label>
                    <div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="password-error"><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show new password">Show</button></div>
                    <span class="field-error" id="password-error" data-error-for="password"></span>
                </div>
                <div class="form-field">
                    <label for="passwordConfirmation">Confirm new password</label>
                    <div class="password-field"><input id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" required aria-describedby="passwordConfirmation-error"><button class="password-toggle" type="button" data-password-toggle="passwordConfirmation" aria-label="Show password confirmation">Show</button></div>
                    <span class="field-error" id="passwordConfirmation-error" data-error-for="passwordConfirmation"></span>
                </div>
                <p class="auth-message" data-form-message role="status" aria-live="polite"></p>
                <button class="button auth-submit" type="submit">Update password</button>
            </form>
        </section>
    </main>
    <footer class="auth-footer"><a href="/">FaithConnect</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
</body>
</html>
